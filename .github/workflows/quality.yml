name: Forgefront Quality Gate
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    name: Game rules, regression and release parity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source syntax and bundled standalone
        run: node tools/verify-release.cjs
      - name: Gameplay and regression tests
        run: node --test tests/forgefront.test.cjs
      - name: Internal P0 generator tests
        run: node --test tests/map-generator.test.cjs
      - name: Internal P1 engine tests
        run: node --test tests/map-battle.test.cjs
      - name: Internal K3 engine, ammo-supply and negative tests
        run: node --test tests/map-battle-k3.test.cjs
      - name: Internal P1 engine smoke run
        run: node tools/map-battle.cjs --count 3 --seed 52741 --budget 2
      - name: K3 reinvestment regression tests
        run: node --test tests/k3-retry.test.cjs
      - name: K3 retry eight failed pilot cards (feature branch only)
        if: github.ref == 'refs/heads/feat/internal-map-battle-k3'
        run: node tools/k3-retry.cjs
      - name: Archive K3 eight-map retry
        if: github.ref == 'refs/heads/feat/internal-map-battle-k3'
        uses: actions/upload-artifact@v4
        with:
          name: forgefront-k3-eight-map-retry
          path: generated/map-k3-retry/
          retention-days: 14
      - name: Archive internal generator and battle reviews
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: forgefront-map-battle-p1-results
          path: generated/map-battle/
          retention-days: 14
