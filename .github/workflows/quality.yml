name: Forgefront Quality Gate
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    name: Game rules, regression and release parity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source syntax and bundled standalone
        run: node tools/verify-release.cjs
      - name: Gameplay and regression tests
        run: node --test tests/forgefront.test.cjs
      - name: Internal P0 generator tests
        run: node --test tests/map-generator.test.cjs
      - name: Internal P0 CLI smoke check
        run: node tools/map-generator.cjs --count 3 --seed 52741
      - name: Archive internal map previews (development only)
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: forgefront-map-generator-p0-preview
          path: generated/map-candidates/
          retention-days: 14
